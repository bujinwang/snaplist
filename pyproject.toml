[project]
name = "snaplist"
version = "0.1.0"
description = "SnapList — photo to listing-ready asset pack for resale sellers"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "pillow>=10.3,<12",
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
]

# PEP 735 dependency groups. `dev` is installed by a plain `uv sync`; `sdxl` is NOT.
#
# **Why the generative stack is a group and not a dependency.** `mode=SDXL_INPAINT` is the
# only thing that needs torch, and it is a mode whose output is currently known not to be
# shippable (see packages/vision/prettify.py and docs/HANDOFF-vision.md §9). Making 0.72 GB of
# site-packages mandatory for `make install` would charge every checkout — including the API
# image and CI — for a stage nobody runs by default, and it already caused one invisible
# regression: with torch present, `runtime.probe()` used to select BiRefNet, which has no
# implementation, so the default vision path started refusing on a machine that had not
# changed. Keep the base install lean; `make install-sdxl` is the explicit act.
[dependency-groups]
dev = [
  "pytest>=8.2,<9",
  "httpx>=0.27,<0.28",
  "ruff>=0.6,<0.7",
]
sdxl = [
  "torch>=2.4",
  "diffusers>=0.31",
  "transformers>=4.44",
  "accelerate>=1.0",
  "safetensors>=0.4",
  "huggingface-hub>=0.25",
]

# PEP 735 OPTIONAL group for the E0-T5 Postgres reader (R3). NOT pulled by a plain `uv sync`:
# the default telemetry gate runs off the SQLite dev DB. Install explicitly with
# `uv sync --group pg` only where a Postgres/Supabase source is actually read.
pg = [
  "psycopg[binary]>=3.2,<4",
]

# PEP 735 OPTIONAL group for the generate_proposals google-nano-banana backend. NOT pulled by a
# plain `uv sync`: the default vision pipeline uses the zero-dep floodfill-border backend. Install
# explicitly with `uv sync --group gen` only where the Gemini image model is actually called, and
# supply GOOGLE_API_KEY at runtime.
gen = [
  "google-genai>=3,<4",
]

# Virtual project: this root is a workspace container, not an installable package.
# Python packages live at apps/api, packages/vision, evals and are imported from the
# repo root (pythonpath = "."), which keeps `python -m packages.vision.cli` working
# exactly as prompts/02-vision.md specifies.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
# R7 (docs/QA.md §10): the E0-T5 telemetry suite is now collected by the default `pytest`,
# so a plain `make test` / `python -m pytest -q` exercises it. It was delivered under a
# whitelist that forbade editing this file; the follow-up ticket wires it in.
testpaths = ["apps/api/tests", "packages/vision/tests", "evals/tests", "evals/telemetry/tests", "infra/ci/gates/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# B008 fires on `def handler(x=Depends(get_user))`, which is not a bug — it is FastAPI's
# dependency-injection syntax. These are the parameter helpers that are *meant* to be called
# in a signature default. Fixing B008 by restructuring an endpoint would be trading a lint
# warning for a real regression, so the false positive is silenced here, in config only.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Security",
  "fastapi.File",
  "fastapi.Form",
]
