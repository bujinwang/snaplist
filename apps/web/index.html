<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SnapList — photo in, listing out</title>
    <style>
      :root {
        --paper: #f2f1ee;
        --ink: #151515;
        --muted: #6b6b6b;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        text-align: center;
      }
      h1 {
        font-size: clamp(2.5rem, 8vw, 4rem);
        letter-spacing: -0.03em;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
        margin: 0.25rem 0;
      }
      .stub {
        margin-top: 2rem;
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SnapList</h1>
      <p>Turn a phone photo of a garment into a listing-ready asset pack.</p>
      <p class="stub">Scaffold placeholder — the real landing page is E7 (growth role).</p>
    </main>
  </body>
</html>
