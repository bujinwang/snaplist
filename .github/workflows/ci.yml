name: ci

# E0-T3. `workflow_dispatch` is the shortest path to a real GitHub job URL
# without having to open a PR first (Bert owns that external verification).
# Deliberately NOT `pull_request_target`: that would hand secrets access to PR
# code. Private-repo fork-PR permission boundary is UNVERIFIED, see README.md.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id MUST stay `ci`: PLAN.md:226 selects it with `act -j ci`.
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v4.2.2 — SHA 由主理人 2026-11-05 git ls-remote 解析
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      # actions/setup-python v5.6.0 — SHA 由主理人 2026-11-05 git ls-remote 解析
      - name: setup python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      # astral-sh/setup-uv v6.4.3 — SHA 由主理人 2026-11-05 git ls-remote 解析
      - name: setup uv 0.8.2
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        with:
          version: "0.8.2"
          enable-cache: true

      # pnpm/action-setup v4.1.0 — SHA 由主理人 2026-11-05 git ls-remote 解析
      # MUST precede setup-node or `cache: pnpm` cannot find pnpm. The repo has
      # no `packageManager` field in package.json, so the version is explicit.
      - name: setup pnpm 12.16.1
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: "12.16.1"

      # actions/setup-node v4.4.0 — SHA 由主理人 2026-11-05 git ls-remote 解析
      - name: setup node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: pnpm

      # Every business step is one line and delegates to steps.sh, the single
      # source of truth for both command text and ordering. No conditionals,
      # no error-swallowing constructs, no unconditional re-runs. Order is
      # identical to STEP_ORDER in infra/ci/steps.sh; `contract_gate` is step 2,
      # BEFORE `install`.
      - name: toolchain_probe
        run: bash infra/ci/steps.sh toolchain_probe
      - name: contract_gate
        run: bash infra/ci/steps.sh contract_gate
      - name: install
        run: bash infra/ci/steps.sh install
      - name: lint_py
        run: bash infra/ci/steps.sh lint_py
      - name: lint_ts
        run: bash infra/ci/steps.sh lint_ts
      - name: test_js
        run: bash infra/ci/steps.sh test_js
      - name: test_py
        run: bash infra/ci/steps.sh test_py
      # steps.sh preserves the telemetry gate's real rc and emits a
      # non-blocking ::warning:: when it sees "GATE NOT EVALUATED".
      - name: evals
        run: bash infra/ci/steps.sh evals
      - name: evals_report
        run: bash infra/ci/steps.sh evals_report
      # E0-T4: both tools are REPORTED, not gated, in this checkout. steps.sh keeps their
      # real exit codes, prints both reports, and turns only the documented "not evaluated"
      # code into a visible warning. A definite regression or budget breach still fails.
      - name: gates_report
        run: bash infra/ci/steps.sh gates_report
      - name: dirty_check
        run: bash infra/ci/steps.sh dirty_check
